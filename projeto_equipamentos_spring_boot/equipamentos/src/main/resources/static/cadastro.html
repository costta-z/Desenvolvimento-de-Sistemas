<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário</title>
    <link rel="stylesheet" href="style.css">
    <script src="cadastro.js" defer></script>
</head>
<body class="pagina-autenticacao">
    <main class="cartao autenticacao">
        <div class="marca">GE</div>
        <h1>Criar conta</h1>
        <p class="subtitulo">Preencha os dados para acessar o sistema.</p>

        <form id="formCadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="100" placeholder="Nome completo" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" maxlength="150" placeholder="usuario@email.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" minlength="8" placeholder="Mínimo de 8 caracteres" required>

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" minlength="8" placeholder="Digite a senha novamente" required>

            <button type="submit" class="botao">Cadastrar usuário</button>
        </form>

        <p id="mensagem" class="mensagem" role="status"></p>
        <p class="rodape-formulario"><a href="login.html">Voltar ao login</a></p>
    </main>
</body>
</html>
