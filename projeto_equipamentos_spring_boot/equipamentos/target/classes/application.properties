spring.application.name=equipamentos

# Configure o usuario e a senha do seu MySQL por variaveis de ambiente.
# Exemplo no Windows (PowerShell): $env:DB_USERNAME="root"
# $env:DB_PASSWORD="sua_senha"
spring.datasource.url=jdbc:mysql://localhost:3306/db_equipamentos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Spring Data JPA cria/atualiza as tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
